<script>

(function () {

  console.log('AEGIS: Page 3 loading wallet LockedRecord...');

  function clean(value) {
    if (value === null || value === undefined) return '';

    return String(value)
      .trim()
      .replace(/^"(.*)"$/, '$1')
      .replace(/\.(private|public)$/i, '')
      .replace(/(u8|u16|u32|u64|u128|u256|field|group|scalar)$/i, '')
      .trim();
  }

  function set(selector, value) {
    const element = document.querySelector(selector);
    if (!element) return;

    element.textContent =
      value !== null &&
      value !== undefined &&
      value !== ''
        ? value
        : '—';
  }

  function formatTimestamp(value) {

    const text = clean(value);

    if (!text) return '—';

    if (/^\d+$/.test(text)) {

      const seconds = Number(text);

      if (
        Number.isSafeInteger(seconds) &&
        seconds > 100000000
      ) {

        const date = new Date(seconds * 1000);

        if (!Number.isNaN(date.getTime())) {

          return date.toLocaleString(
            'en-US',
            {
              day: '2-digit',
              month: 'short',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              hour12: true,
              timeZone: 'UTC',
              timeZoneName: 'short'
            }
          );

        }

      }

    }

    return text;
  }

  function getTimestampSeconds(value) {

    const text = clean(value);

    if (!text) return null;

    if (/^\d+$/.test(text)) {

      const seconds = Number(text);

      if (
        Number.isSafeInteger(seconds) &&
        seconds > 100000000
      ) {
        return seconds;
      }

    }

    return null;
  }

  function getWalletRecord() {

    const raw =
      sessionStorage.getItem(
        'usdcxSelectedRecord'
      );

    if (!raw) return null;

    try {

      return JSON.parse(raw);

    } catch (error) {

      console.error(
        'AEGIS: Could not parse wallet record:',
        error
      );

      return null;
    }
  }

  const record = getWalletRecord();

  console.log(
    'AEGIS: EXACT WALLET RECORD RECEIVED BY PAGE 3:',
    record
  );

  if (!record) {

    const errorBox =
      document.querySelector(
        '[data-record-error]'
      );

    if (errorBox) {
      errorBox.style.display = 'block';
    }

    console.warn(
      'AEGIS: No wallet record was passed from Page 2.'
    );

    return;
  }

  if (
    clean(record.program_id).toLowerCase() !==
    'vusdc_transaction.aleo'
  ) {

    console.error(
      'AEGIS: Wrong program record:',
      record
    );

    const errorBox =
      document.querySelector(
        '[data-record-error]'
      );

    if (errorBox) {
      errorBox.style.display = 'block';
    }

    return;
  }

  if (
    clean(record.recordName) !==
    'LockedRecord'
  ) {

    console.error(
      'AEGIS: Wrong record type:',
      record
    );

    const errorBox =
      document.querySelector(
        '[data-record-error]'
      );

    if (errorBox) {
      errorBox.style.display = 'block';
    }

    return;
  }

  const owner =
    clean(record.owner);

  const recordId =
    clean(record.id);

  const program =
    clean(record.program_id);

  const recordType =
    clean(record.recordName);

  const spent =
    record.spent === true
      ? 'TRUE'
      : record.spent === false
        ? 'FALSE'
        : '—';

  const data =
    record.data &&
    typeof record.data === 'object'
      ? record.data
      : {};

  const status =
    clean(data.status);

  const lockedEnd =
    clean(data.locked_end);

  const claimRoute =
    clean(data.claim_route);

  const version =
    clean(data._version);

  let displayStatus =
    status;

  if (displayStatus === '1') {
    displayStatus = 'LOCKED';
  }

  if (displayStatus === '2') {
    displayStatus = 'CLAIMED';
  }

  if (!displayStatus) {
    displayStatus = '—';
  }

  /* =======================================================
     ONLY DATA THAT ACTUALLY EXISTS IN WALLET LockedRecord
     ======================================================= */

  set(
    '[data-page3-owner]',
    owner
  );

  set(
    '[data-page3-record-id]',
    recordId
  );

  set(
    '[data-page3-program]',
    program
  );

  set(
    '[data-page3-type]',
    recordType
  );

  set(
    '[data-page3-status]',
    displayStatus
  );

  set(
    '[data-page3-end]',
    formatTimestamp(lockedEnd)
  );

  /* =======================================================
     THESE DO NOT EXIST IN THE WALLET LockedRecord
     KEEP THE EXISTING VISUAL ROWS — SHOW ONLY —
     ======================================================= */

  set(
    '[data-page3-amount]',
    ''
  );

  set(
    '[data-page3-start]',
    ''
  );

  set(
    '[data-page3-duration]',
    ''
  );

  set(
    '[data-page3-token]',
    ''
  );

  set(
    '[data-page3-transaction]',
    ''
  );

  set(
    '[data-page3-token-id]',
    ''
  );

  set(
    '[data-page3-lock-record-id]',
    ''
  );

  /* =======================================================
     NO EXTERNAL DATA / NO EXPLORER LINKS
     ======================================================= */

  const transactionLink =
    document.querySelector(
      '[data-page3-transaction-link]'
    );

  if (transactionLink) {
    transactionLink.removeAttribute('href');
  }

  const tokenLink =
    document.querySelector(
      '[data-page3-token-link]'
    );

  if (tokenLink) {
    tokenLink.removeAttribute('href');
  }

  const lockRecordLink =
    document.querySelector(
      '[data-page3-lock-record-link]'
    );

  if (lockRecordLink) {
    lockRecordLink.removeAttribute('href');
  }

  /* =======================================================
     COUNTDOWN — USE ONLY LockedRecord.locked_end
     ======================================================= */

  const countdownElement =
    document.querySelector(
      '[data-lock-countdown]'
    );

  const countdownEndElement =
    document.querySelector(
      '[data-countdown-end]'
    );

  const claimButton =
    document.querySelector(
      '[data-claim-button]'
    );

  const claimMessage =
    document.querySelector(
      '[data-claim-message]'
    );

  const endSeconds =
    getTimestampSeconds(
      lockedEnd
    );

  let countdownTimer = null;

  let lockEnded = false;

  function updateCountdown() {

    if (!countdownElement) {
      return;
    }

    if (endSeconds === null) {

      countdownElement.textContent =
        '—';

      if (countdownEndElement) {

        countdownEndElement.textContent =
          'Lock end time unavailable';

      }

      return;
    }

    const nowSeconds =
      Math.floor(
        Date.now() / 1000
      );

    let remaining =
      endSeconds - nowSeconds;

    if (remaining <= 0) {

      lockEnded = true;

      countdownElement.textContent =
        'LOCK ENDED';

      countdownElement.classList.add(
        'countdown-ended'
      );

      if (countdownEndElement) {

        countdownEndElement.textContent =
          'The lock period has ended';

      }

      if (claimButton) {

        claimButton.disabled =
          false;

        claimButton.textContent =
          'CLAIM';

      }

      if (countdownTimer) {

        clearInterval(
          countdownTimer
        );

        countdownTimer = null;

      }

      return;
    }

    const days =
      Math.floor(
        remaining / 86400
      );

    remaining -=
      days * 86400;

    const hours =
      Math.floor(
        remaining / 3600
      );

    remaining -=
      hours * 3600;

    const minutes =
      Math.floor(
        remaining / 60
      );

    remaining -=
      minutes * 60;

    const seconds =
      remaining;

    countdownElement.textContent =
      String(days) +
      'd ' +
      String(hours).padStart(2, '0') +
      'h ' +
      String(minutes).padStart(2, '0') +
      'm ' +
      String(seconds).padStart(2, '0') +
      's';

    if (countdownEndElement) {

      countdownEndElement.textContent =
        'Ends: ' +
        formatTimestamp(
          lockedEnd
        );

    }
  }

  updateCountdown();

  if (endSeconds !== null) {

    countdownTimer =
      setInterval(
        updateCountdown,
        1000
      );

  }

  /* =======================================================
     CLAIM
     ======================================================= */

  if (claimButton) {

    claimButton.addEventListener(
      'click',
      function () {

        if (!lockEnded) {

          if (claimMessage) {

            claimMessage.classList.remove(
              'success'
            );

            claimMessage.style.display =
              'block';

            claimMessage.textContent =
              'Not available until lock end.';

          }

          return;
        }

        if (claimMessage) {

          claimMessage.classList.add(
            'success'
          );

          claimMessage.style.display =
            'block';

          claimMessage.textContent =
            'Lock ended. Claim is available for contract integration.';

        }

        console.log(
          'AEGIS: Lock ended. No transaction was sent.'
        );

      }
    );

  }

  /* =======================================================
     EXACT WALLET RECORD DEBUG
     ======================================================= */

  console.log(
    'AEGIS: Wallet record ID:',
    recordId
  );

  console.log(
    'AEGIS: Wallet owner:',
    owner
  );

  console.log(
    'AEGIS: Wallet program:',
    program
  );

  console.log(
    'AEGIS: Wallet record type:',
    recordType
  );

  console.log(
    'AEGIS: Wallet spent:',
    spent
  );

  console.log(
    'AEGIS: Wallet claim_route:',
    claimRoute
  );

  console.log(
    'AEGIS: Wallet locked_end:',
    lockedEnd
  );

  console.log(
    'AEGIS: Wallet status:',
    status
  );

  console.log(
    'AEGIS: Wallet _version:',
    version
  );

  console.log(
    'AEGIS: Page 3 is now using ONLY the wallet LockedRecord.'
  );

})();

</script>
