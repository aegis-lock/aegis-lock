<script>
(function () {
  'use strict';

  console.log(
    'AEGIS: Page 3 loading current selected wallet record only...'
  );

  /* =======================================================
     HELPERS
     ======================================================= */

  function clean(value) {
    if (
      value === null ||
      value === undefined
    ) {
      return '';
    }

    return String(value)
      .replace(/^["']|["']$/g, '')
      .replace(/\.private$/i, '')
      .replace(/\.public$/i, '')
      .replace(
        /(u8|u16|u32|u64|u128|u256|field|group|scalar)$/i,
        ''
      )
      .trim();
  }


  function getValue(record, names) {
    if (!record) {
      return '';
    }

    for (const name of names) {

      if (
        record[name] !== undefined &&
        record[name] !== null
      ) {
        return record[name];
      }

      if (
        record.data &&
        record.data[name] !== undefined &&
        record.data[name] !== null
      ) {
        return record.data[name];
      }

    }

    return '';
  }


  function set(selector, value) {
    const element =
      document.querySelector(selector);

    if (element) {
      element.textContent =
        value === null ||
        value === undefined ||
        value === ''
          ? '—'
          : String(value);
    }
  }


  function formatTimestamp(value) {

    const seconds =
      Number(clean(value));

    if (!Number.isFinite(seconds)) {
      return '—';
    }

    const date =
      new Date(seconds * 1000);

    if (
      Number.isNaN(date.getTime())
    ) {
      return '—';
    }

    return date.toLocaleString(
      'en-US',
      {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true,
        timeZone: 'UTC',
        timeZoneName: 'short'
      }
    );
  }


  function calculateDuration(start, end) {

    const s =
      Number(clean(start));

    const e =
      Number(clean(end));

    if (
      !Number.isFinite(s) ||
      !Number.isFinite(e)
    ) {
      return '—';
    }

    const seconds =
      e - s;

    if (seconds <= 0) {
      return '—';
    }

    const days =
      seconds / 86400;

    if (
      Math.abs(
        days - Math.round(days)
      ) < 0.01
    ) {
      return (
        Math.round(days) +
        ' Days'
      );
    }

    return (
      days.toFixed(2) +
      ' Days'
    );
  }


  function showError() {
    const errorBox =
      document.querySelector(
        '[data-record-error]'
      );

    if (errorBox) {
      errorBox.style.display = 'block';
    }
  }


  /* =======================================================
     READ ONLY THE CURRENT PAGE-2 RECORD
     ======================================================= */

  let rawRecord = null;

  try {

    const savedRecord =
      sessionStorage.getItem(
        'usdcxSelectedRecord'
      );

    if (!savedRecord) {

      console.warn(
        'AEGIS: No current selected wallet record.'
      );

      showError();

      return;
    }

    rawRecord =
      JSON.parse(savedRecord);

  } catch (error) {

    console.error(
      'AEGIS: Could not read current wallet record:',
      error
    );

    showError();

    return;
  }


  /* =======================================================
     HARD VALIDATION
     
     Page 3 accepts ONLY the raw record saved by
     Page 2.

     NO:
     - old allocation
     - localStorage
     - admin data
     - previous record
     - hardcoded amount
     - hardcoded start date
     ======================================================= */

  const currentWallet =
    clean(
      sessionStorage.getItem(
        'usdcxAddress'
      )
    ).toLowerCase();


  const recordOwner =
    clean(
      getValue(
        rawRecord,
        [
          'owner',
          'owner_address'
        ]
      )
    ).toLowerCase();


  const program =
    clean(
      rawRecord.program_id ||
      rawRecord.programId ||
      getValue(
        rawRecord,
        [
          'program_id',
          'program'
        ]
      )
    );


  if (
    currentWallet &&
    recordOwner &&
    currentWallet !== recordOwner
  ) {

    console.error(
      'AEGIS: Page 3 blocked wallet mismatch.',
      {
        currentWallet,
        recordOwner
      }
    );

    showError();

    return;
  }


  if (
    program &&
    program.toLowerCase() !==
      'vusdc_transaction.aleo'
  ) {

    console.error(
      'AEGIS: Page 3 blocked wrong program:',
      program
    );

    showError();

    return;
  }


  /* =======================================================
     EXTRACT ONLY VALUES THAT ACTUALLY EXIST
     IN THIS CURRENT RECORD
     ======================================================= */

  const owner =
    getValue(
      rawRecord,
      [
        'owner',
        'owner_address'
      ]
    );


  const recordId =
    getValue(
      rawRecord,
      [
        'id',
        'record_id',
        'recordId',
        'serial_number',
        'commitment'
      ]
    );


  const amount =
    getValue(
      rawRecord,
      [
        'display_amount',
        'amount',
        'locked_amount'
      ]
    );


  const start =
    getValue(
      rawRecord,
      [
        'locked_start',
        'start_time',
        'start'
      ]
    );


  const end =
    getValue(
      rawRecord,
      [
        'locked_end',
        'end_time',
        'end'
      ]
    );


  const token =
    getValue(
      rawRecord,
      [
        'token',
        'tokenSymbol',
        'asset',
        'claimableToken'
      ]
    );


  const transactionId =
    getValue(
      rawRecord,
      [
        'transaction_id',
        'transactionId',
        'tx_id',
        'txId'
      ]
    );


  const tokenId =
    getValue(
      rawRecord,
      [
        'token_id',
        'tokenId'
      ]
    );


  const lockRecordId =
    getValue(
      rawRecord,
      [
        'lock_record_id',
        'lockRecordId'
      ]
    );


  const statusRaw =
    getValue(
      rawRecord,
      [
        'status'
      ]
    );


  const statusClean =
    clean(statusRaw);


  const displayStatus =
    statusClean === '1'
      ? 'LOCKED'
      : statusClean === '2'
        ? 'CLAIMED'
        : statusClean
          ? statusClean
          : 'LOCKED';


  const recordType =
    rawRecord.recordName ||
    rawRecord.record_type ||
    'LockedRecord';


  const duration =
    calculateDuration(
      start,
      end
    );


  /* =======================================================
     POPULATE PAGE 3
     
     IMPORTANT:
     Missing fields remain "—".
     Nothing is taken from another record.
     ======================================================= */

  set(
    '[data-page3-allocation]',
    'ALLOCATION 01'
  );


  set(
    '[data-page3-ticket]',
    getValue(
      rawRecord,
      [
        'ticket_ref',
        'ticket_reference',
        'ticket'
      ]
    )
  );


  set(
    '[data-page3-owner]',
    clean(owner)
  );


  /* NEVER use 16,268 or any previous amount */
  set(
    '[data-page3-amount]',
    clean(amount)
      ? clean(amount) + ' vUSDC'
      : '—'
  );


  /* NEVER use Sep 01 or any previous start date */
  set(
    '[data-page3-start]',
    clean(start)
      ? formatTimestamp(start)
      : '—'
  );


  set(
    '[data-page3-end]',
    clean(end)
      ? formatTimestamp(end)
      : '—'
  );


  set(
    '[data-page3-duration]',
    duration
  );


  set(
    '[data-page3-token]',
    clean(token) || 'vUSDC'
  );


  set(
    '[data-page3-program]',
    program ||
    'vusdc_transaction.aleo'
  );


  set(
    '[data-page3-type]',
    recordType
  );


  set(
    '[data-page3-status]',
    displayStatus
  );


  set(
    '[data-page3-record-id]',
    clean(recordId)
  );


  /* =======================================================
     TRANSACTION / TOKEN / LOCK RECORD
     ======================================================= */

  set(
    '[data-page3-transaction]',
    clean(transactionId)
  );


  set(
    '[data-page3-token-id]',
    clean(tokenId)
  );


  set(
    '[data-page3-lock-record-id]',
    clean(lockRecordId)
  );


  /* =======================================================
     COUNTDOWN
     
     Countdown uses ONLY locked_end from this record.
     ======================================================= */

  const countdownElement =
    document.querySelector(
      '[data-lock-countdown]'
    );


  const countdownEndElement =
    document.querySelector(
      '[data-countdown-end]'
    );


  const countdownEnd =
    Number(clean(end));


  if (
    countdownEndElement &&
    Number.isFinite(countdownEnd)
  ) {

    countdownEndElement.textContent =
      formatTimestamp(end);

  }


  function updateCountdown() {

    if (
      !countdownElement ||
      !Number.isFinite(countdownEnd)
    ) {
      return;
    }


    const now =
      Math.floor(
        Date.now() / 1000
      );


    let remaining =
      countdownEnd - now;


    if (remaining <= 0) {

      countdownElement.textContent =
        'UNLOCKED';

      return;
    }


    const days =
      Math.floor(
        remaining / 86400
      );

    remaining %= 86400;


    const hours =
      Math.floor(
        remaining / 3600
      );

    remaining %= 3600;


    const minutes =
      Math.floor(
        remaining / 60
      );

    const seconds =
      remaining % 60;


    countdownElement.textContent =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;
  }


  updateCountdown();


  if (
    Number.isFinite(countdownEnd)
  ) {

    setInterval(
      updateCountdown,
      1000
    );

  }


  /* =======================================================
     CLAIM BUTTON
     ======================================================= */

  const claimButton =
    document.querySelector(
      '[data-claim-button]'
    );


  const claimMessage =
    document.querySelector(
      '[data-claim-message]'
    );


  if (claimButton) {

    claimButton.disabled =
      !Number.isFinite(countdownEnd);

    claimButton.addEventListener(
      'click',
      () => {

        if (
          !Number.isFinite(
            countdownEnd
          )
        ) {
          return;
        }


        const now =
          Math.floor(
            Date.now() / 1000
          );


        if (
          now < countdownEnd
        ) {

          if (claimMessage) {

            claimMessage.textContent =
              'Claim becomes available after the lock period ends.';

          }

          return;
        }


        if (claimMessage) {

          claimMessage.textContent =
            'Claim is now available.';

        }

      }
    );

  }


  /* =======================================================
     BLOCKCHAIN LINKS
     
     Only create links when THIS CURRENT RECORD
     actually contains the corresponding value.
     ======================================================= */

  const transactionLinks =
    document.querySelectorAll(
      '[data-page3-transaction-link]'
    );


  transactionLinks.forEach(link => {

    const value =
      clean(transactionId);

    if (!value) {

      link.style.display =
        'none';

      return;
    }

    link.href =
      'https://explorer.provable.com/transaction/' +
      value;

    link.target =
      '_blank';

    link.rel =
      'noopener noreferrer';

  });


  const lockRecordLinks =
    document.querySelectorAll(
      '[data-page3-lock-record-link]'
    );


  lockRecordLinks.forEach(link => {

    const value =
      clean(lockRecordId);

    if (!value) {

      link.style.display =
        'none';

      return;
    }

    link.href =
      'https://explorer.provable.com/transaction/' +
      value;

    link.target =
      '_blank';

    link.rel =
      'noopener noreferrer';

  });


  /* =======================================================
     FINAL LOG
     ======================================================= */

  console.log(
    'AEGIS: Page 3 populated from CURRENT wallet record only.'
  );

  console.log(
    'AEGIS: Current record:',
    rawRecord
  );

  console.log(
    'AEGIS: Owner:',
    clean(owner)
  );

  console.log(
    'AEGIS: Amount:',
    clean(amount) || '—'
  );

  console.log(
    'AEGIS: Start:',
    clean(start) || '—'
  );

  console.log(
    'AEGIS: End:',
    clean(end) || '—'
  );

  console.log(
    'AEGIS: No previous allocation data is used.'
  );

})();
</script>
