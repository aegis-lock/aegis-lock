<script>

(function () {

  console.log(
    'AEGIS: Page 3 loading wallet LockedRecord...'
  );


  /* =======================================================
     CLEAN ALEO VALUE
     ======================================================= */

  function clean(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return '';
    }

    let text = String(value).trim();

    text = text.replace(
      /^"(.*)"$/,
      '$1'
    );

    text = text.replace(
      /\.(private|public)$/i,
      ''
    );

    text = text.replace(
      /(u8|u16|u32|u64|u128|u256|field|group|scalar)$/i,
      ''
    );

    return text.trim();

  }


  /* =======================================================
     GET VALUE FROM WALLET RECORD ONLY
     ======================================================= */

  function getRecordValue(record, names) {

    if (!record) {
      return '';
    }


    for (const name of names) {

      if (
        record[name] !== undefined &&
        record[name] !== null
      ) {

        return record[name];

      }

    }


    if (
      record.data &&
      typeof record.data === 'object'
    ) {

      for (const name of names) {

        if (
          record.data[name] !== undefined &&
          record.data[name] !== null
        ) {

          return record.data[name];

        }

      }

    }


    return '';

  }


  /* =======================================================
     SET PAGE VALUE
     ======================================================= */

  function set(selector, value) {

    const element =
      document.querySelector(selector);

    if (!element) {
      return;
    }

    element.textContent =
      clean(value) || '—';

  }


  /* =======================================================
     TIMESTAMP
     ======================================================= */

  function getTimestampSeconds(value) {

    const text =
      clean(value);

    if (!text) {
      return null;
    }

    if (/^\d+$/.test(text)) {

      const seconds =
        Number(text);

      if (
        Number.isSafeInteger(seconds) &&
        seconds > 100000000
      ) {

        return seconds;

      }

    }

    return null;

  }


  /* =======================================================
     FORMAT LOCKED END
     ======================================================= */

  function formatTimestamp(value) {

    const seconds =
      getTimestampSeconds(value);

    if (seconds === null) {
      return '';
    }

    const date =
      new Date(
        seconds * 1000
      );

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return '';

    }

    return date.toLocaleString(
      'en-US',
      {
        day: '2-digit',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true,
        timeZone: 'UTC',
        timeZoneName: 'short'
      }
    );

  }


  /* =======================================================
     READ WALLET RECORD FROM PAGE 2
     
     IMPORTANT:
     Page 3 does NOT invent missing information.
     It only displays the LockedRecord supplied by
     the wallet / Page 2.
     ======================================================= */

  let walletRecord = null;


  try {

    const savedRecord =
      sessionStorage.getItem(
        'usdcxSelectedRecord'
      );


    if (savedRecord) {

      const parsed =
        JSON.parse(
          savedRecord
        );


      /*
       * Accept the exact wallet record:
       *
       * [
       *   {
       *     id: "...",
       *     owner: "...",
       *     program_id: "...",
       *     recordName: "LockedRecord",
       *     data: {...}
       *   }
       * ]
       */


      if (Array.isArray(parsed)) {

        walletRecord =
          parsed.find(
            record =>
              record &&
              (
                record.recordName ===
                'LockedRecord'
                ||
                record.data?.claim_route !==
                undefined
              )
          ) || null;

      } else {

        walletRecord =
          parsed;

      }

    }

  } catch (error) {

    console.error(
      'AEGIS: Could not read wallet LockedRecord:',
      error
    );

  }


  console.log(
    'AEGIS: Wallet LockedRecord:',
    walletRecord
  );


  /* =======================================================
     NO LOCKED RECORD
     ======================================================= */

  if (!walletRecord) {

    const errorBox =
      document.querySelector(
        '[data-record-error]'
      );

    if (errorBox) {

      errorBox.style.display =
        'block';

    }

    return;

  }


  /* =======================================================
     VERIFY RECORD TYPE
     ======================================================= */

  const recordName =
    getRecordValue(
      walletRecord,
      [
        'recordName'
      ]
    );


  const programId =
    getRecordValue(
      walletRecord,
      [
        'program_id'
      ]
    );


  const claimRoute =
    getRecordValue(
      walletRecord,
      [
        'claim_route'
      ]
    );


  if (
    recordName !== 'LockedRecord' &&
    !claimRoute
  ) {

    const errorBox =
      document.querySelector(
        '[data-record-error]'
      );

    if (errorBox) {

      errorBox.style.display =
        'block';

    }

    console.warn(
      'AEGIS: Selected wallet record is not a LockedRecord.'
    );

    return;

  }


  /* =======================================================
     SOURCE FIELDS
     
     ONLY fields actually contained in the wallet record
     are allowed to populate Page 3.
     ======================================================= */


  const owner =
    getRecordValue(
      walletRecord,
      [
        'owner'
      ]
    );


  const lockedEnd =
    getRecordValue(
      walletRecord,
      [
        'locked_end'
      ]
    );


  const status =
    getRecordValue(
      walletRecord,
      [
        'status'
      ]
    );


  /* =======================================================
     FIELDS NOT PRESENT IN LockedRecord = EMPTY
     ======================================================= */

  const amount = '';

  const lockedStart = '';

  const token = '';

  const transactionId = '';

  const tokenId = '';

  const lockRecordId = '';


  /* =======================================================
     STATUS
     ======================================================= */

  let displayStatus =
    clean(status).toUpperCase();


  if (
    displayStatus === '1'
  ) {

    displayStatus =
      'LOCKED';

  }


  /* =======================================================
     RECORD TYPE
     ======================================================= */

  const recordType =
    clean(recordName) ||
    'LockedRecord';


  /* =======================================================
     RECORD ID
     
     The wallet object contains an "id", so use ONLY that.
     No transaction ID or generated ID is used.
     ======================================================= */

  const recordId =
    getRecordValue(
      walletRecord,
      [
        'id'
      ]
    );


  /* =======================================================
     DURATION
     
     LockedRecord does not contain locked_start.
     Therefore duration cannot be calculated.
     ======================================================= */

  const duration = '';


  /* =======================================================
     POPULATE PAGE 3
     ======================================================= */

  set(
    '[data-page3-allocation]',
    ''
  );


  set(
    '[data-page3-owner]',
    owner
  );


  set(
    '[data-page3-amount]',
    amount
  );


  set(
    '[data-page3-start]',
    lockedStart
  );


  set(
    '[data-page3-end]',
    formatTimestamp(lockedEnd)
  );


  set(
    '[data-page3-duration]',
    duration
  );


  set(
    '[data-page3-token]',
    token
  );


  set(
    '[data-page3-program]',
    programId
  );


  set(
    '[data-page3-type]',
    recordType
  );


  set(
    '[data-page3-status]',
    displayStatus
  );


  set(
    '[data-page3-record-id]',
    recordId
  );


  /* =======================================================
     BLOCKCHAIN REFERENCES
     
     These fields do NOT exist inside the supplied
     LockedRecord, therefore they remain empty.
     ======================================================= */

  set(
    '[data-page3-transaction]',
    transactionId
  );


  set(
    '[data-page3-token-id]',
    tokenId
  );


  set(
    '[data-page3-lock-record-id]',
    lockRecordId
  );


  /* =======================================================
     REMOVE EXPLORER LINKS WHEN NO ID EXISTS
     ======================================================= */

  const transactionLink =
    document.querySelector(
      '[data-page3-transaction-link]'
    );


  if (transactionLink) {

    transactionLink.removeAttribute(
      'href'
    );

  }


  const tokenLink =
    document.querySelector(
      '[data-page3-token-link]'
    );


  if (tokenLink) {

    tokenLink.removeAttribute(
      'href'
    );

  }


  const lockRecordLink =
    document.querySelector(
      '[data-page3-lock-record-link]'
    );


  if (lockRecordLink) {

    lockRecordLink.removeAttribute(
      'href'
    );

  }


  /* =======================================================
     COUNTDOWN
     
     Countdown is allowed because locked_end exists
     in the wallet LockedRecord.
     ======================================================= */

  const countdownElement =
    document.querySelector(
      '[data-lock-countdown]'
    );


  const countdownEndElement =
    document.querySelector(
      '[data-countdown-end]'
    );


  const claimButton =
    document.querySelector(
      '[data-claim-button]'
    );


  const claimMessage =
    document.querySelector(
      '[data-claim-message]'
    );


  const endSeconds =
    getTimestampSeconds(
      lockedEnd
    );


  let countdownTimer =
    null;


  let lockEnded =
    false;


  /* =======================================================
     UPDATE COUNTDOWN
     ======================================================= */

  function updateCountdown() {

    if (!countdownElement) {
      return;
    }


    if (
      endSeconds === null
    ) {

      countdownElement.textContent =
        '—';


      if (countdownEndElement) {

        countdownEndElement.textContent =
          'Lock end time unavailable';

      }

      return;

    }


    const nowSeconds =
      Math.floor(
        Date.now() / 1000
      );


    let remaining =
      endSeconds -
      nowSeconds;


    if (remaining <= 0) {

      lockEnded =
        true;


      countdownElement.textContent =
        'LOCK ENDED';


      countdownElement.classList.add(
        'countdown-ended'
      );


      if (countdownEndElement) {

        countdownEndElement.textContent =
          'The lock period has ended';

      }


      if (claimButton) {

        claimButton.disabled =
          false;

        claimButton.textContent =
          'CLAIM';

      }


      if (countdownTimer) {

        clearInterval(
          countdownTimer
        );

        countdownTimer =
          null;

      }


      return;

    }


    const days =
      Math.floor(
        remaining / 86400
      );


    remaining -=
      days * 86400;


    const hours =
      Math.floor(
        remaining / 3600
      );


    remaining -=
      hours * 3600;


    const minutes =
      Math.floor(
        remaining / 60
      );


    remaining -=
      minutes * 60;


    const seconds =
      remaining;


    countdownElement.textContent =
      String(days) +
      'd ' +
      String(hours).padStart(2, '0') +
      'h ' +
      String(minutes).padStart(2, '0') +
      'm ' +
      String(seconds).padStart(2, '0') +
      's';


    if (countdownEndElement) {

      countdownEndElement.textContent =
        'Ends: ' +
        formatTimestamp(lockedEnd);

    }

  }


  /* =======================================================
     START COUNTDOWN
     ======================================================= */

  updateCountdown();


  if (endSeconds !== null) {

    countdownTimer =
      setInterval(
        updateCountdown,
        1000
      );

  }


  /* =======================================================
     CLAIM BUTTON
     ======================================================= */

  if (claimButton) {

    claimButton.addEventListener(
      'click',
      function () {

        if (!lockEnded) {

          if (claimMessage) {

            claimMessage.classList.remove(
              'success'
            );


            claimMessage.style.display =
              'block';


            claimMessage.textContent =
              'Not available until lock end.';

          }


          return;

        }


        if (claimMessage) {

          claimMessage.classList.add(
            'success'
          );


          claimMessage.style.display =
            'block';


          claimMessage.textContent =
            'Lock ended. Claim is available for contract integration.';

        }


        console.log(
          'AEGIS: Lock ended. No transaction was sent.'
        );

      }
    );

  }


  /* =======================================================
     FINAL LOG
     ======================================================= */

  console.log(
    'AEGIS: Page 3 populated ONLY from wallet LockedRecord.'
  );


  console.log(
    'AEGIS: Owner:',
    clean(owner)
  );


  console.log(
    'AEGIS: Locked End:',
    formatTimestamp(lockedEnd)
  );


  console.log(
    'AEGIS: Status:',
    displayStatus
  );


  console.log(
    'AEGIS: Program:',
    clean(programId)
  );


  console.log(
    'AEGIS: Record Type:',
    recordType
  );


  console.log(
    'AEGIS: Record ID:',
    clean(recordId)
  );


})();

</script>
